<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Be My Valentine 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ffd6e8, #ffeef5);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #5a0036;
  overflow: hidden;
  cursor: url('https://cdn-icons-png.flaticon.com/512/833/833472.png') 16 16, auto;
}

/* Card */
.card {
  position: relative;
  background: #fff0f7;
  padding: 30px;
  border-radius: 24px;
  width: 90%;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 0 25px rgba(255,182,193,0.45);
  animation: popIn 0.8s ease, glow 3s ease-in-out infinite;
}

.hidden { display: none; }

h1 {
  font-family: 'Pacifico', cursive;
  font-size: 2.2rem;
}

.btn {
  margin: 10px;
  padding: 12px 20px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-size: 1rem;
  transition: transform 0.2s, box-shadow 0.2s;
}

.btn:hover {
  transform: scale(1.08);
  box-shadow: 0 8px 20px rgba(255,105,180,0.35);
}

.yes { background: #ff5fa2; color: white; }
.no { background: #ffd1e6; color: #8a004f; }

.gifts button {
  background: #ffb3d9;
  color: #6b003b;
}

/* Letter */
.letter {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  border: 2px dashed #ff8fc7;
  max-height: 250px;
  overflow-y: auto;
  text-align: left;
  white-space: pre-wrap;
  animation: typing 3.5s steps(40, end);
}

/* Flowers */
.flowers {
  font-size: 2rem;
  animation: float 2s infinite ease-in-out;
}

/* Hearts */
.heart {
  position: absolute;
  bottom: -20px;
  color: rgba(255,182,193,0.4);
  font-size: 18px;
  animation: floatUp linear infinite;
}

/* Confetti */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  animation: confettiFall 3s linear forwards;
}

/* Animations */
@keyframes popIn {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes glow {
  0%,100% { box-shadow: 0 0 20px rgba(255,182,193,0.35); }
  50% { box-shadow: 0 0 35px rgba(255,105,180,0.55); }
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 0; }
  to { transform: translateY(-110vh); opacity: 1; }
}

@keyframes confettiFall {
  to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

@keyframes typing {
  from { max-height: 0; opacity: 0; }
  to { max-height: 250px; opacity: 1; }
}

audio { display: none; }
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="ADD_BACKGROUND_MUSIC_MP3_URL_HERE" type="audio/mpeg">
</audio>

<div class="card" id="screen1">
  <h1>Will you be my Valentine? 💕</h1>
  <button class="btn yes" onclick="yesClicked()">Yes, of course 💖</button>
  <button class="btn no" id="noBtn" onclick="noClicked()">No thanks 🙄</button>
</div>

<div class="card hidden" id="screenNo">
  <h1>Excuse me??? 😤</h1>
  <p>Wrong answer. Try again. Carefully.</p>
  <button class="btn yes" onclick="goHome()">Okay okay 😅</button>
</div>

<div class="card hidden" id="screenYes">
  <h1>Thank you for gracing me with this honour 💘</h1>
  <p>Here are 3 gifts for you</p>
  <div class="gifts">
    <button class="btn" onclick="gift1()">🎁 Gift 1</button>
    <button class="btn" onclick="gift2()">🎁 Gift 2</button>
    <button class="btn" onclick="gift3()">🎁 Gift 3</button>
  </div>
</div>

<div class="card hidden" id="gift1">
  <h1>These are for you 🌸</h1>
  <div class="flowers">💐🌷🌹🌸🌺</div>
  <button class="btn" onclick="goYes()">⬅ Back</button>
</div>

<div class="card hidden" id="gift2">
  <h1>A letter for you 💌</h1>
  <div class="letter">
[PASTE YOUR LETTER CONTENT HERE]
  </div>
  <button class="btn" onclick="goYes()">⬅ Back</button>
</div>

<div class="card hidden" id="gift3">
  <h1>Scan me 🎶</h1>
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=APPLE_MUSIC_LINK_HERE" />
  <button class="btn" onclick="goYes()">⬅ Back</button>
</div>

<script>
// Hearts
for (let i = 0; i < 25; i++) {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.innerHTML = '❤';
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.animationDuration = 6 + Math.random() * 6 + 's';
  document.body.appendChild(heart);
}

// No button movement
const noBtn = document.getElementById('noBtn');
noBtn.addEventListener('mouseover', () => {
  noBtn.style.transform = `translate(${Math.random()*100-50}px, ${Math.random()*60-30}px)`;
  noBtn.style.transition = 'transform 0.6s ease';
});

// Confetti
function launchConfetti() {
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = ['#ff5fa2','#ffc0cb','#ff8fc7'][Math.floor(Math.random()*3)];
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

function playMusic() {
  const music = document.getElementById('bgMusic');
  music.volume = 0.3;
  music.play();
}

function hideAll() {
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
}

function yesClicked() {
  hideAll();
  document.getElementById('screenYes').classList.remove('hidden');
  launchConfetti();
  playMusic();
}

function noClicked() {
  hideAll();
  document.getElementById('screenNo').classList.remove('hidden');
}

function goHome() {
  hideAll();
  document.getElementById('screen1').classList.remove('hidden');
}

function goYes() {
  hideAll();
  document.getElementById('screenYes').classList.remove('hidden');
}

function gift1() { hideAll(); document.getElementById('gift1').classList.remove('hidden'); }
function gift2() { hideAll(); document.getElementById('gift2').classList.remove('hidden'); }
function gift3() { hideAll(); document.getElementById('gift3').classList.remove('hidden'); }
</script>

</body>
</html>
